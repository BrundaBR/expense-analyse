<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Expense Analysis</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <h1>Expense Analysis</h1>
        </div>
        <ul>
            <li><a href="#">Dashboard</a></li>
        </ul>
    </nav>
    <div class="main">
        
        <div class="form-input">
            <h1>Current Spends</h1>
            <form class="expense-track">

                <table border="1">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Comment</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="expense-table-body">
                        <tr>
                            <td><input type="text" name="category" id="category"></td>
                            <td><input type="number" name="amount" id="amount"></td>
                            <td><input type="text" name="comment" id="comment"></td>
                            <td><input type="date" name="date" id="date"></td>
                        </tr>
                    </tbody>
                </table>

                <button class="submit-form" type="submit">Add Expense</button>
            </form>

            <button class="add-row" type="button">Add Row</button>
        </div>
        <div class="analytics">
            <div class="dropdown">
            <label for="month-select">Select Month:</label>
            <select id="month-select">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
           
        </div>
            <div class="chart-container">
                <h1>Analytics</h1>
                <h3 id = "total-amount">Total Amount spent</h3>
                <canvas id="expense-chart"></canvas>
            </div>
        </div>
    </div>
    <script type="module" src="/js/index.js"></script>
    <script type="module" src="./db/test_db.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</body>

</html>
